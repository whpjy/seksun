name: seksun-meas-service

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.service
    image: seksun/meas-api:1.0.0
    ports:
      - "8080:8080"
    environment:
      MEAS_MAX_UPLOAD_MB: "${MEAS_MAX_UPLOAD_MB:-200}"
      MEAS_PROCESS_TIMEOUT_SECONDS: "${MEAS_PROCESS_TIMEOUT_SECONDS:-600}"
      MEAS_MAX_CONCURRENT_JOBS: "${MEAS_MAX_CONCURRENT_JOBS:-2}"
      MEAS_CORS_ORIGINS: "${MEAS_CORS_ORIGINS:-http://localhost:5173}"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      QWEN_BASE_URL: "${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      AGENT_DEFAULT_MODEL: "${AGENT_DEFAULT_MODEL:-qwen3.7-plus-2026-05-26}"
      AGENT_ESCALATION_MODEL: "${AGENT_ESCALATION_MODEL:-qwen3.8-max}"
      AGENT_MAX_TOOL_ROUNDS: "${AGENT_MAX_TOOL_ROUNDS:-12}"
      AGENT_ESCALATION_RESIDUAL_MM: "${AGENT_ESCALATION_RESIDUAL_MM:-0.15}"
      AGENT_MODEL_MODE: "${AGENT_MODEL_MODE:-auto}"
    volumes:
      - meas-jobs:/data/jobs
    restart: unless-stopped

volumes:
  meas-jobs:
